<head>
    <meta charset="UTF-8">

    <!-- custom css file link  -->
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">

</head>

<body>
    <div class="curtain" aria-hidden="true"><b>Million's Dev</b></div>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="ring" aria-hidden="true"></div>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>

    <!-- navbar section starts  -->

    <nav class="navbar" aria-label="Navigation principale">
        <a href="index.html"><i class="fas fa-home" aria-hidden="true"></i><span>Accueil</span></a>
        <a href="about.html"><i class="fas fa-user" aria-hidden="true"></i><span>À propos</span></a>
        <a href="portfolio.html"><i class="fas fa-briefcase" aria-hidden="true"></i><span>Projets</span></a>
        <a href="blogs.html"><i class="fas fa-layer-group" aria-hidden="true"></i><span>Journal</span></a>
        <a href="contact.html"><i class="fas fa-paper-plane" aria-hidden="true"></i><span>Contact</span></a>
        <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Basculer entre mode clair et mode sombre"><i class="fas fa-moon"
                aria-hidden="true"></i></button>
    </nav>

    <!-- navbar section ends -->

    <!-- contact section starts  -->

    <section class="contact">

        <h1 class="heading"> Entrons en <span>contact</span> </h1>

        <div class="row">

            <div class="info-container">

                <h1>Un projet en tête ?</h1>

                <p>Parlons de votre idée, de vos besoins et de la façon dont nous pouvons lui donner vie sur le web.</p>

                <div class="box-container">

                    <div class="box">
                        <i class="fas fa-map"></i>
                        <div class="info">
                            <h3>Adresse :</h3>
                            <p>Douala - Cameroun</p>
                        </div>
                    </div>

                    <div class="box">
                        <i class="fas fa-envelope"></i>
                        <div class="info">
                            <h3>Email :</h3>
                            <p>pedrodelrunko58@gmail.com</p>
                        </div>
                    </div>

                    <div class="box">
                        <i class="fas fa-phone"></i>
                        <div class="info">
                            <h3>Téléphone :</h3>
                            <p>+237 696618526</p>
                        </div>
                    </div>

                </div>

                <div class="share">
                    <a href="https://wa.me/237696618526" class="fab fa-whatsapp"></a>
                    <a href="https://www.instagram.com/pedrodelrunko" class="fab fa-instagram"></a>
                    <a href="https://www.linkedin.com/in/pedro-delrunko-329270315" class="fab fa-linkedin"></a>
                </div>

            </div>

            <form id="contact-form">

                <div class="inputBox">
                    <input type="text" id="name" placeholder="Votre nom" aria-label="Votre nom" required>
                    <input type="tel" id="number" placeholder="Votre numéro" aria-label="Votre numéro">
                </div>

                <div class="inputBox">
                    <input type="email" id="email" placeholder="Votre adresse e-mail" aria-label="Votre adresse e-mail"
                        required>
                    <input type="text" id="subject" placeholder="Sujet" aria-label="Sujet">
                </div>

                <textarea id="message" placeholder="Décrivez votre projet..." aria-label="Votre message" cols="30"
                    rows="10" required></textarea>

                <input type="submit" value="Envoyer sur WhatsApp" class="btn">

            </form>

        </div>

    </section>

    <script>
        // Ton numéro WhatsApp (format international, sans le +)
        const WHATSAPP_NUMBER = "237696618526";

        const form = document.getElementById('contact-form');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const number = document.getElementById('number').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !email || !message) {
                alert("Merci de remplir au moins le nom, l'email et le message.");
                return;
            }

            // On construit le texte du message WhatsApp à partir du formulaire
            let text = `Nom : ${name}\n`;
            if (number) text += `Numéro : ${number}\n`;
            text += `Email : ${email}\n`;
            if (subject) text += `Sujet : ${subject}\n`;
            text += `\nMessage :\n${message}`;

            const encodedText = encodeURIComponent(text);
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedText}`;

            // Ouvre WhatsApp (app mobile ou WhatsApp Web) avec le message pré-rempli
            window.open(whatsappUrl, '_blank');

            form.reset();
        });
    </script>

    <!-- contact section ends -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/fx.js"></script>
</body>

</html>
